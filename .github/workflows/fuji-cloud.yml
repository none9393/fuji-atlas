name: FUJI-ATLAS cloud analysis

on:
  workflow_dispatch:
    inputs:
      fresh_data:
        description: "Ignore saved market cache and collect a fresh bootstrap"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "2,32 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fuji-cloud-pages
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r cloud/requirements.txt
      - name: Verify report validator is present
        run: test -f cloud/validate_reports.py && test -f validate_reports.py
      - uses: actions/cache/restore@v4
        with:
          path: .fuji-cache
          key: fuji-market-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuji-market-cache-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: .fuji-published
          key: fuji-published-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuji-published-${{ runner.os }}-
      - name: Reset market cache for a fresh run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_data }}
        run: rm -rf .fuji-cache /tmp/fuji-market-data.json
      - name: Run FUJI safely
        id: analysis
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          set +e
          python cloud/run_cloud.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 4 ]; then exit "$code"; fi
      - name: Enforce PDF report contract
        id: validation
        if: steps.analysis.outputs.exit_code == '0'
        run: python cloud/validate_reports.py cloud-output
      - name: Preserve latest valid reports
        if: always() && (steps.analysis.outputs.exit_code == '4' || (steps.analysis.outputs.exit_code == '0' && steps.validation.outcome == 'success'))
        run: |
          mkdir -p .fuji-published cloud-output
          rm -f .fuji-published/XAUUSD.pdf .fuji-published/EURUSD.pdf
          if find cloud-output -maxdepth 1 -name '*.pdf' -print -quit | grep -q .; then cp cloud-output/*.pdf .fuji-published/; fi
          for symbol in XAUUSD EURUSD; do
            find .fuji-published -maxdepth 1 -name "${symbol}_*.pdf" -printf '%T@ %p\n' \
              | sort -rn | tail -n +201 | cut -d' ' -f2- | while IFS= read -r old; do rm -f "$old"; done
          done
          test -f cloud-output/health.json || printf '%s\n' '{"decision":"blocked","reason":"runner did not produce health.json"}' > cloud-output/health.json
          python cloud/build_report_portal.py
      - name: Publish latest PDF release assets
        if: steps.analysis.outputs.exit_code == '0' && steps.validation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          xau="$(find cloud-output -maxdepth 1 -type f -name 'XAUUSD_*.pdf' -print | sort | tail -n 1)"
          eur="$(find cloud-output -maxdepth 1 -type f -name 'EURUSD_*.pdf' -print | sort | tail -n 1)"
          if [ -z "$xau" ] && [ -z "$eur" ]; then
            echo "No new timestamped PDFs; preserving existing fuji-latest release assets."
            exit 0
          fi
          if ! gh release view fuji-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create fuji-latest --repo "${GITHUB_REPOSITORY}" \
              --title "FUJI latest reports" \
              --notes "Automatically updated latest FUJI PDF reports." \
              --target "${GITHUB_SHA}"
          fi
          if [ -n "$xau" ]; then
            cp "$xau" /tmp/XAUUSD-latest.pdf
            gh release upload fuji-latest /tmp/XAUUSD-latest.pdf --repo "${GITHUB_REPOSITORY}" --clobber
          fi
          if [ -n "$eur" ]; then
            cp "$eur" /tmp/EURUSD-latest.pdf
            gh release upload fuji-latest /tmp/EURUSD-latest.pdf --repo "${GITHUB_REPOSITORY}" --clobber
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .fuji-cache
          key: fuji-market-cache-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .fuji-published
          key: fuji-published-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuji-reports-${{ github.run_number }}
          path: |
            cloud-output/*.pdf
            cloud-output/health.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/configure-pages@v5
        if: steps.analysis.outputs.exit_code == '4' || (steps.analysis.outputs.exit_code == '0' && steps.validation.outcome == 'success')
      - uses: actions/upload-pages-artifact@v3
        if: steps.analysis.outputs.exit_code == '4' || (steps.analysis.outputs.exit_code == '0' && steps.validation.outcome == 'success')
        with:
          path: cloud-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: steps.analysis.outputs.exit_code == '4' || (steps.analysis.outputs.exit_code == '0' && steps.validation.outcome == 'success')
      - name: Summary
        if: always()
        run: |
          echo "Analysis exit code: ${{ steps.analysis.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages: https://none9393.github.io/fuji-atlas/" >> "$GITHUB_STEP_SUMMARY"
