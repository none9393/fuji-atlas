name: FUJI-ATLAS cloud analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * 1-5"
    - cron: "15 6-14 * * 1-5"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check reportlab
      - name: Verify and generate FUJI PDFs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          METALPRICEAPI_KEY: ${{ secrets.METALPRICEAPI_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          printf '%s\n' '{}' > /tmp/fuji-empty.json
          python cloud/run_cloud.py
      - name: Send PDFs to Telegram (optional)
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for pdf in cloud-output/*.pdf; do
            curl --fail --silent --show-error --max-time 30 \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F document="@$pdf" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fuji-reports-${{ github.run_number }}
          path: cloud-output/*.pdf
          retention-days: 30
